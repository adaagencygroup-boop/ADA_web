global:
  scrape_interval: 1s
  evaluation_interval: 1s
scrape_configs:
  - job_name: 'ada'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 1s
    static_configs:
      - targets: ['app:8080', 'host.docker.internal:8080']
        labels:
          application: 'ada'
          environment: 'production'
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']