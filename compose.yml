services:
  app:
    image: ${appImage:-ghcr.io/vak1412/ada/app:latest}
    build: .
    container_name: app
    restart: always
    env_file:
      - .env
    volumes:
      - storage:/var/app/storage
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - net
  admin-web:
    image: ${adminWebImage:-ada-admin-web:latest}
    build:
      context: ./FE/ada-group-admin-website
      args:
        NEXT_PUBLIC_API_BASE_URL: ${nextPublicApiBaseUrl:-https://adagroup.com.vn/api/v1}
    container_name: admin-web
    restart: always
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - net
  public-web:
    image: ${publicWebImage:-ada-public-web:latest}
    build:
      context: ./FE/ada-group-website
      args:
        NEXT_PUBLIC_API_BASE_URL: ${nextPublicApiBaseUrl:-https://adagroup.com.vn/api/v1}
    container_name: public-web
    restart: always
    environment:
      # Server Components run inside this container, so they must reach the
      # backend via the Docker network's service name, not the public URL
      # baked into the browser bundle via NEXT_PUBLIC_API_BASE_URL.
      API_BASE_URL: http://app:8080/api/v1
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - net
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${dbUsername}
      POSTGRES_PASSWORD: ${dbPassword}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=200
      - -c
      - effective_cache_size=1024MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - pg:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    networks:
      - net
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - net
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - storage:/var/app/storage:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    networks:
      - net
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - net
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - net
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    user: "0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 100M
    networks:
      - net
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    user: "0"
    ports:
      - "9000:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - net
volumes:
  pg:
  redis:
  storage:
  loki:
  prometheus:
  grafana:
networks:
  net:
    driver: bridge