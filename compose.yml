services:
  app:
    image: ${appImage:-ghcr.io/adaagencygroup-boop/ada_web/app:latest}
    build: .
    container_name: app
    restart: always
    entrypoint: >
      /bin/sh -c "mkdir -p /var/app/storage/news /var/app/storage/recruitments /var/app/storage/contacts /var/app/storage/resumes /var/app/storage/media /var/app/storage/backups && chmod -R 777 /var/app/storage && exec java -Xms256m -Xmx512m -XX:+UseG1GC -XX:MaxMetaspaceSize=160m -Djdk.virtualThreadScheduler.parallelism=2 --enable-preview -jar /app/app.jar"
    env_file:
      - .env
    volumes:
      - storage:/var/app/storage
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 768M
        reservations:
          cpus: '0.3'
          memory: 256M
    networks:
      - net
  admin:
    image: admin
    build:
      context: ./FE/ada-group-admin-website
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${nextPublicApiBaseUrl:-https://adaagencygroup.online/api/v1}
    container_name: admin
    restart: always
    environment:
      NODE_ENV: production
      API_BASE_URL: http://app:8080/api/v1
      NEXT_PUBLIC_API_BASE_URL: ${nextPublicApiBaseUrl:-https://adaagencygroup.online/api/v1}
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - net
  public:
    image: public
    build:
      context: ./FE/ada-group-website
      target: runner
      args:
        NEXT_PUBLIC_API_BASE_URL: ${nextPublicApiBaseUrl:-https://adaagencygroup.online/api/v1}
    container_name: public
    restart: always
    environment:
      NODE_ENV: production
      API_BASE_URL: http://app:8080/api/v1
      NEXT_PUBLIC_API_BASE_URL: ${nextPublicApiBaseUrl:-https://adaagencygroup.online/api/v1}
      NODE_OPTIONS: "--max-old-space-size=256"
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - net
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${dbUsername}
      POSTGRES_PASSWORD: ${dbPassword}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=60
      - -c
      - effective_cache_size=384MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - pg:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - net
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --save 900 1
    volumes:
      - redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    networks:
      - net
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - storage:/var/app/storage:ro
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    networks:
      - net
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - net
  node:
    image: prom/node-exporter:latest
    container_name: node
    restart: always
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.02'
          memory: 32M
    networks:
      - net
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki:/loki
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      - net
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    user: "0"
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 16M
    networks:
      - net
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    user: "0"
    ports:
      - "9000:3000"
    environment:
      GOGC: "50"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      - net
volumes:
  pg:
  redis:
  storage:
  loki:
  prometheus:
  grafana:
networks:
  net:
    driver: bridge