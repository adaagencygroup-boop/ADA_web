services:
  app:
    ports:
      - "8080:8080"
  admin-web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
  public-web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3001:3000"
